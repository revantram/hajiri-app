name: Build & Release APK

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v1.2)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Read App Version from Gradle
        id: ver
        run: |
          APP_VER=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          APP_VER=${APP_VER:-1.2}
          echo "version=$APP_VER" >> "$GITHUB_OUTPUT"

      - name: Check Firebase Config for Source Build
        id: cfg
        env:
          GOOGLE_SERVICES_RAW: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f "app/google-services.json" ] && [ -n "$GOOGLE_SERVICES_RAW" ]; then
            if printf '%s' "$GOOGLE_SERVICES_RAW" | grep -q '"project_info"'; then
              printf '%s\n' "$GOOGLE_SERVICES_RAW" > app/google-services.json
            else
              printf '%s' "$GOOGLE_SERVICES_RAW" | tr -d '[:space:]' | base64 -d > app/google-services.json
            fi
          fi
          if [ -f "app/google-services.json" ]; then
            if ! python3 -m json.tool app/google-services.json > /dev/null 2>&1; then
              echo "::error::GOOGLE_SERVICES_JSON valid JSON nahi hai. Poori app/google-services.json file copy karke dubara paste karein."
              exit 1
            fi
            echo "can_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::app/google-services.json missing! Add GitHub Secret GOOGLE_SERVICES_JSON in Repo Settings -> Secrets and variables -> Actions."
            echo "can_build=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Set up JDK 21
        if: steps.cfg.outputs.can_build == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Prepare Android SDK & Install Build Tools
        if: steps.cfg.outputs.can_build == 'true'
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_DIR"
          export ANDROID_SDK_ROOT="$SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n1 || true)
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            mkdir -p "$SDK_DIR/cmdline-tools"
            curl -sSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-extract
            mv /tmp/cmdline-extract/cmdline-tools "$SDK_DIR/cmdline-tools/latest"
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_DIR" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        if: steps.cfg.outputs.can_build == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Ensure debug.keystore exists
        if: steps.cfg.outputs.can_build == 'true'
        env:
          DEBUG_KEYSTORE_SECRET: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ -n "$DEBUG_KEYSTORE_SECRET" ]; then
              if ! python3 -c 'import base64,os,re; raw=os.environ.get("DEBUG_KEYSTORE_SECRET",""); cleaned=re.sub(r"\s+","",re.sub(r"^\s*\d+:\s*","",raw).strip().strip("\"").strip("\x27")); print("DEBUG_KEYSTORE_B64 cleaned len=",len(cleaned)); data=base64.b64decode(cleaned,validate=True); open("debug.keystore","wb").write(data); print("Decoded bytes=",len(data))'; then
                echo "::error::DEBUG_KEYSTORE_B64 invalid base64! Expected 3536 chars from debug.keystore.base64."
                exit 1
              fi
              if ! keytool -list -keystore debug.keystore -storepass android > /dev/null 2>&1; then
                echo "::error::Decoded DEBUG_KEYSTORE_B64 is not a valid Android keystore! Re-copy full debug.keystore.base64."
                exit 1
              fi
            elif [ -f "debug.keystore.base64" ]; then
              tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
            else
              echo "::warning::DEBUG_KEYSTORE_B64 secret not set; generating temporary keystore (Google Sign-In & updating over previous APK may fail)."
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Release & Debug APKs from Source
        if: steps.cfg.outputs.can_build == 'true'
        run: gradle assembleRelease assembleDebug --no-daemon

      - name: Prepare Release APK Assets
        if: steps.cfg.outputs.can_build == 'true'
        run: |
          mkdir -p release-assets
          VER="${{ steps.ver.outputs.version }}"
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk "release-assets/Hajiri-v${VER}-Release.apk"
          else
            echo "Error: Release APK build output not found"
            exit 1
          fi
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "release-assets/Hajiri-v${VER}-Debug.apk"
          fi
          ls -lh release-assets/

      - name: Upload APK Artifacts
        if: steps.cfg.outputs.can_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hajiri-apks
          path: release-assets/*.apk

      - name: Determine Release Tag
        id: tag
        run: |
          VER="${{ steps.ver.outputs.version }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: steps.cfg.outputs.can_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "हाजिरी (Hajiri) Android App ${{ steps.tag.outputs.tag }}"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ### 📱 हाजिरी (Hajiri) — ${{ steps.tag.outputs.tag }}

            नीचे **Assets** से **`Hajiri-v${{ steps.ver.outputs.version }}-Release.apk`** पर क्लिक करके सीधे अपने Android फोन में डाउनलोड और इंस्टॉल करें। ऐप के अंदर **ऑटो अपडेट** भी इसी GitHub Release से नया वर्ज़न अपने आप पहचान लेता है।

            - **`Hajiri-v${{ steps.ver.outputs.version }}-Release.apk`** — मुख्य रिलीज़ ऐप (Recommended)
          files: |
            release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
