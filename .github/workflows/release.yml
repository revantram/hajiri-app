name: Build & Release APK

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v1.0.1)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK & Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Ensure debug.keystore exists
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Release & Debug APKs
        run: gradle assembleRelease assembleDebug --no-daemon

      - name: Read App Version from Gradle
        id: ver
        run: |
          APP_VER=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          APP_VER=${APP_VER:-1.1}
          echo "version=$APP_VER" >> "$GITHUB_OUTPUT"

      - name: Prepare Release APK Assets
        run: |
          mkdir -p release-assets
          VER="${{ steps.ver.outputs.version }}"
          cp app/build/outputs/apk/release/app-release.apk "release-assets/Hajiri-v${VER}-Release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/Hajiri-v${VER}-Debug.apk"
          ls -lh release-assets/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hajiri-apks
          path: release-assets/*.apk

      - name: Determine Release Tag
        id: tag
        run: |
          VER="${{ steps.ver.outputs.version }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${VER}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "हाजिरी (Hajiri) Android App ${{ steps.tag.outputs.tag }}"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ### 📱 हाजिरी (Hajiri) — ${{ steps.tag.outputs.tag }}

            नीचे **Assets** से **`Hajiri-v${{ steps.ver.outputs.version }}-Release.apk`** पर क्लिक करके सीधे अपने Android फोन में डाउनलोड और इंस्टॉल करें। ऐप के अंदर **ऑटो अपडेट** भी इसी GitHub Release से नया वर्ज़न अपने आप पहचान लेता है।

            - **`Hajiri-v${{ steps.ver.outputs.version }}-Release.apk`** — मुख्य रिलीज़ ऐप (Recommended)
            - **`Hajiri-v${{ steps.ver.outputs.version }}-Debug.apk`** — डीबग बिल्ड
          files: |
            release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
